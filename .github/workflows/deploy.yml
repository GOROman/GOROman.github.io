name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          # 1) New site at the root (full overwrite, 2026-11-15)
          cp site/index.html deploy/
          cp -r site/assets deploy/
          cp site/sw.js deploy/
          # 2) Redirect so existing /portfolio.html links do not 404
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=/"><link rel="canonical" href="/"><title>GOROman.org</title><a href="/">GOROman.org</a>' > deploy/portfolio.html
          # 3) MDX player, kept ("mdxは残して"): Vite output goes under deploy/mdx/
          mkdir -p deploy/mdx
          cp -r dist/* deploy/mdx/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
